name: bulk-transfers

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bulk_transfers
      POSTGRES_USER: challenge
      POSTGRES_PASSWORD: challenge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U challenge -d bulk_transfers"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

  app:
    build: .
    environment:
      CHALLENGE_DATABASE_URL: jdbc:postgresql://postgres:5432/bulk_transfers
      CHALLENGE_DATABASE_USER: challenge
      CHALLENGE_DATABASE_PASSWORD: challenge
      CHALLENGE_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  seed:
    image: postgres:17-alpine
    profiles: ["tools"]
    environment:
      PGPASSWORD: challenge
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db/demo/seed.sql:/seed.sql:ro
    command: ["psql", "-h", "postgres", "-U", "challenge", "-d", "bulk_transfers", "-f", "/seed.sql"]

volumes:
  postgres-data:
